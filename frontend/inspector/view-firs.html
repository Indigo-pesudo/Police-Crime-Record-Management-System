<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View FIRs - PCRMS</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #1f2937;
        }

        .header {
            background: #0f2041;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #1c376d;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            color: #0f2041;
            margin-top: 0;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #0f2041;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8f9fb;
        }

        .view-btn {
            background: #0f2041;
            color: white;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 5px;
        }

        .view-btn:hover {
            background: #1c376d;
        }

        .status {
            font-weight: bold;
        }

        .loading,
        .error,
        .empty {
            padding: 20px;
            text-align: center;
        }

        .error {
            color: #b00020;
        }

    </style>

</head>


<body>


<header class="header">

    <h2>PCRMS | View FIRs</h2>

    <a href="dashboard.html" class="back-btn">
        ← Dashboard
    </a>

</header>


<div class="container">

    <div class="card">

        <h1>Registered FIRs</h1>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>FIR Number</th>

                        <th>Date</th>

                        <th>Complainant</th>

                        <th>Location</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="firTableBody">

                    <tr>

                        <td colspan="6" class="loading">
                            Loading FIRs...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>


    // =========================
    // CHECK LOGIN
    // =========================

    const userData =
        sessionStorage.getItem("pcrmsUser");


    if (!userData) {

        window.location.href =
            "../index.html";

    }


    const user =
        JSON.parse(userData);


    // =========================
    // CHECK ROLE
    // =========================

    if (user.role !== "INSPECTOR") {

        alert("Access denied.");

        window.location.href =
            "../index.html";

    }


    // =========================
    // LOAD FIRs
    // =========================

    async function loadFIRs() {

        const tableBody =
            document.getElementById("firTableBody");


        try {

            const response =
                await fetch(
                    "http://localhost:8080/api/firs",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + user.token
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load FIRs"
                );

            }


            const firs =
                await response.json();


            // =========================
            // NO FIRs
            // =========================

            if (firs.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="empty">

                            No FIRs registered yet.

                        </td>

                    </tr>

                `;

                return;

            }


            // =========================
            // DISPLAY FIRs
            // =========================

            tableBody.innerHTML =
                firs.map(fir => `

                    <tr>

                        <td>
                            ${escapeHtml(
                                fir.firNumber ?? ""
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                fir.date ?? ""
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                fir.complainantName ?? ""
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                fir.incidentLocation ?? ""
                            )}
                        </td>

                        <td class="status">
                            ${escapeHtml(
                                fir.status ?? ""
                            )}
                        </td>

                        <td>

                            <a
                                href="fir-details.html?id=${fir.id}"
                                class="view-btn">

                                View Details

                            </a>

                        </td>

                    </tr>

                `).join("");


        } catch (error) {

            console.error(error);


            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="error">

                        Unable to load FIR data.

                    </td>

                </tr>

            `;

        }

    }


    // =========================
    // HTML SECURITY
    // =========================

    function escapeHtml(value) {

        return String(value)

            .replaceAll("&", "&amp;")

            .replaceAll("<", "&lt;")

            .replaceAll(">", "&gt;")

            .replaceAll('"', "&quot;")

            .replaceAll("'", "&#039;");

    }


    // =========================
    // START
    // =========================

    loadFIRs();


</script>


</body>

</html>

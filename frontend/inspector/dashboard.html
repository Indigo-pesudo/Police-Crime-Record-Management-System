<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PCRMS - Inspector Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #1f2937;
        }

        .header {
            height: 70px;
            background: #0f2041;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .header h2 {
            font-size: 22px;
        }

        .logout-btn {
            background: #dc3545;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #0f2041;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 6px;
            background: #0f2041;
            color: white;
            display: inline-block;
        }

        .action-btn:hover {
            background: #1c376d;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <h2>PCRMS | Inspector Panel</h2>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </header>


    <main class="container">

        <div class="welcome">

            <h1 id="welcomeMessage">
                Welcome, Inspector
            </h1>

            <p>
                Police Crime Record Management System
            </p>

        </div>


        <div class="cards">

    <div class="card">
        <h3>Registered FIRs</h3>
        <div class="number" id="registeredFIRs">-</div>
    </div>

    <div class="card">
        <h3>Active Cases</h3>
        <div class="number" id="activeCases">0</div>
    </div>

    <div class="card">
        <h3>Evidence Records</h3>
        <div class="number" id="evidenceRecords">0</div>
    </div>

</div>


        <div class="section">

            <h2>Inspector Actions</h2>

            <div class="actions">

                <a href="register-fir.html" class="action-btn">
                    Register FIR
                </a>
                <a href="view-firs.html" class="action-btn">
                    View FIRs
                </a>
                <a href="evidence-management.html" class="action-btn">
                    Evidence Management
                </a>

                <a href="case-management.html" class="action-btn">
                    Case Management
                </a>

            </div>

        </div>
        <div class="section" style="margin-top: 30px;">

    <h2>Recent FIRs</h2>

    <table style="width: 100%; border-collapse: collapse;">

        <thead>
            <tr>
                <th style="text-align:left; padding:12px;">
                    FIR Number
                </th>

                <th style="text-align:left; padding:12px;">
                    Date
                </th>

                <th style="text-align:left; padding:12px;">
                    Complainant
                </th>

                <th style="text-align:left; padding:12px;">
                    Status
                </th>
            </tr>
        </thead>

        <tbody id="recentFIRs">
            <tr>
                <td colspan="4" style="padding:12px;">
                    Loading...
                </td>
            </tr>
        </tbody>

    </table>

</div>

    </main>


    <script>

const userData = sessionStorage.getItem("pcrmsUser");

if (!userData) {
    window.location.href = "../index.html";
}

const user = JSON.parse(userData);

if (user.role !== "INSPECTOR") {
    alert("Access denied.");
    window.location.href = "../index.html";
}

document.getElementById("welcomeMessage").textContent =
    `Welcome, ${user.fullName}`;


function logout() {

    sessionStorage.removeItem("pcrmsUser");

    window.location.href = "../index.html";
}


async function loadDashboardStats() {

    try {

        // =========================
        // LOAD FIR DATA
        // =========================

        const response = await fetch(
            "http://localhost:8080/api/firs",
            {
                method: "GET",

                headers: {
                    "Authorization": "Bearer " + user.token
                }
            }
        );


        if (!response.ok) {
            throw new Error("Failed to load FIRs");
        }


        const firs = await response.json();


        // FIR COUNT

        document.getElementById("registeredFIRs").textContent =
            firs.length;


        // =========================
        // RECENT FIRs
        // =========================

        const recentFIRs =
            document.getElementById("recentFIRs");


        if (firs.length === 0) {

            recentFIRs.innerHTML = `
                <tr>
                    <td colspan="4" style="padding:12px;">
                        No FIRs registered yet.
                    </td>
                </tr>
            `;

        } else {

            const latestFIRs =
                firs.slice(-5).reverse();


            recentFIRs.innerHTML =
                latestFIRs.map(fir => `

                    <tr>

                        <td style="padding:12px;">
                            ${fir.firNumber}
                        </td>

                        <td style="padding:12px;">
                            ${fir.date}
                        </td>

                        <td style="padding:12px;">
                            ${fir.complainantName}
                        </td>

                        <td style="padding:12px;">
                            ${fir.status}
                        </td>

                    </tr>

                `).join("");

        }


        // =========================
        // LOAD CASE DATA
        // =========================

        const caseResponse = await fetch(
            "http://localhost:8080/api/cases/stats",
            {
                method: "GET",

                headers: {
                    "Authorization": "Bearer " + user.token
                }
            }
        );


        if (!caseResponse.ok) {
            throw new Error("Failed to load case statistics");
        }


        const activeCases =
            await caseResponse.json();


        document.getElementById("activeCases").textContent =
            activeCases;


    } catch (error) {

        console.error(
            "Dashboard error:",
            error
        );


        document.getElementById(
            "registeredFIRs"
        ).textContent = "-";


        document.getElementById(
            "activeCases"
        ).textContent = "-";


        document.getElementById(
            "recentFIRs"
        ).innerHTML = `
            <tr>
                <td colspan="4" style="padding:12px;">
                    Unable to load dashboard data.
                </td>
            </tr>
        `;

    }

}


// LOAD DASHBOARD ONCE

loadDashboardStats();

</script>

</body>

</html>

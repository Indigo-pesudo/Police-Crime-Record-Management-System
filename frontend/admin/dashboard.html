<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PCRMS - Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f9;
            color: #1f2937;
        }


        .header {
            height: 70px;
            background: #0f2041;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }


        .header h2 {
            font-size: 22px;
        }


        .logout-btn {
            background: #dc3545;
            border: none;
            color: white;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;
        }


        .logout-btn:hover {
            background: #b02a37;
        }


        .container {
            padding: 30px;
        }


        .welcome {
            margin-bottom: 25px;
        }


        .welcome h1 {
            margin-bottom: 8px;
        }


        .welcome p {
            color: #6b7280;
        }


        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .card {
            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .card h3 {
            color: #6b7280;

            font-size: 14px;

            margin-bottom: 12px;
        }


        .card .number {
            font-size: 30px;

            font-weight: bold;

            color: #0f2041;
        }


        .section {
            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .section h2 {
            margin-bottom: 20px;
        }


        .actions {
            display: flex;

            gap: 15px;

            flex-wrap: wrap;
        }


        .action-btn {
            padding: 12px 20px;

            border: none;

            border-radius: 6px;

            background: #0f2041;

            color: white;

            cursor: pointer;

            text-decoration: none;

            display: inline-block;

            font-size: 15px;
        }


        .action-btn:hover {
            background: #1c376d;
        }


        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }


            .actions {
                flex-direction: column;
            }


            .action-btn {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <h2>
        PCRMS | Admin Panel
    </h2>


    <button
        class="logout-btn"
        onclick="logout()">

        Logout

    </button>

</header>


<main class="container">


    <div class="welcome">

        <h1 id="welcomeMessage">
            Welcome, Administrator
        </h1>


        <p>
            Police Crime Record Management System
        </p>

    </div>



    <!-- STATISTICS -->

    <div class="cards">


        <div class="card">

            <h3>
                Total Users
            </h3>

            <div
                class="number"
                id="totalUsers">

                -

            </div>

        </div>



        <div class="card">

            <h3>
                Inspectors
            </h3>

            <div
                class="number"
                id="inspectors">

                -

            </div>

        </div>



        <div class="card">

            <h3>
                Clerks
            </h3>

            <div
                class="number"
                id="clerks">

                -

            </div>

        </div>



        <div class="card">

            <h3>
                Active Users
            </h3>

            <div
                class="number"
                id="activeUsers">

                -

            </div>

        </div>


    </div>



    <!-- QUICK ACTIONS -->

    <div class="section">

        <h2>
            Quick Actions
        </h2>


        <div class="actions">


            <a
                href="manage-users.html"
                class="action-btn">

                Manage Users

            </a>



            <a
                href="reports.html"
                class="action-btn">

                View Reports

            </a>



            <a
                href="system-settings.html"
                class="action-btn">

                System Settings

            </a>


        </div>

    </div>


</main>



<script>


    /*
     * GET LOGGED-IN USER
     */

    const userData =
        sessionStorage.getItem(
            "pcrmsUser"
        );



    /*
     * CHECK LOGIN
     */

    if (!userData) {

        window.location.href =
            "../index.html";

    }



    const user =
        JSON.parse(userData);



    /*
     * CHECK ADMIN ROLE
     */

    if (user.role !== "ADMIN") {

        alert(
            "Access denied."
        );

        window.location.href =
            "../index.html";

    }



    /*
     * DISPLAY ADMIN NAME
     */

    document.getElementById(
        "welcomeMessage"
    ).textContent =
        `Welcome, ${user.fullName}`;



    /*
     * LOAD ADMIN STATISTICS
     */

    async function loadStats() {

        try {

            const response =
                await fetch(
                    "http://localhost:8080/api/admin/stats",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " +
                                user.token
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load statistics"
                );

            }


            const stats =
                await response.json();


            document.getElementById(
                "totalUsers"
            ).textContent =
                stats.totalUsers;


            document.getElementById(
                "inspectors"
            ).textContent =
                stats.inspectors;


            document.getElementById(
                "clerks"
            ).textContent =
                stats.clerks;


            document.getElementById(
                "activeUsers"
            ).textContent =
                stats.activeUsers;


        }
        catch (error) {

            console.error(
                "Dashboard error:",
                error
            );


            document.getElementById(
                "totalUsers"
            ).textContent = "-";


            document.getElementById(
                "inspectors"
            ).textContent = "-";


            document.getElementById(
                "clerks"
            ).textContent = "-";


            document.getElementById(
                "activeUsers"
            ).textContent = "-";

        }

    }



    /*
     * LOGOUT
     */

    function logout() {

        sessionStorage.removeItem(
            "pcrmsUser"
        );


        window.location.href =
            "../index.html";

    }



    /*
     * LOAD STATISTICS
     */

    loadStats();


</script>


</body>

</html>

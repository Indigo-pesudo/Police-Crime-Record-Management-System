<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PCRMS - Clerk Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #1f2937;
        }

        .header {
            height: 70px;
            background: #0f2041;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .header h2 {
            font-size: 22px;
        }

        .logout-btn {
            background: #dc3545;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #0f2041;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 6px;
            background: #0f2041;
            color: white;
            display: inline-block;
        }

        .action-btn:hover {
            background: #1c376d;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <h2>PCRMS | Clerk Panel</h2>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </header>


    <main class="container">

        <div class="welcome">

            <h1 id="welcomeMessage">
                Welcome, Clerk
            </h1>

            <p>
                Police Crime Record Management System
            </p>

        </div>


        <div class="cards">

            <div class="card">
                <h3>Total FIRs</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Criminal Records</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Reports</h3>
                <div class="number">0</div>
            </div>

        </div>


        <div class="section">

            <h2>Clerk Actions</h2>

            <div class="actions">

                <a href="search-fir.html" class="action-btn">
                    Search FIR
                </a>

                <a href="criminal-records.html" class="action-btn">
                    Criminal Records
                </a>

                <a href="reports.html" class="action-btn">
                    Reports
                </a>

            </div>

        </div>

    </main>


    <script>

        const userData =
            sessionStorage.getItem("pcrmsUser");


        if (!userData) {

            window.location.href = "../index.html";

        }


        const user =
            JSON.parse(userData);


        if (user.role !== "CLERK") {

            alert("Access denied.");

            window.location.href = "../index.html";

        }


        document
            .getElementById("welcomeMessage")
            .textContent =
            `Welcome, ${user.fullName}`;


        function logout() {

            sessionStorage.removeItem("pcrmsUser");

            window.location.href =
                "../index.html";

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clerk Dashboard - PCRMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #0f2041;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0;
            opacity: 0.85;
        }

        .logout-btn {
            background: #c62828;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #a91f1f;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin-bottom: 5px;
            color: #0f2041;
        }

        .welcome p {
            color: #666;
        }


        /* =========================
           STAT CARDS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 40px;
        }

        .stat-card {

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

            border-left:
                5px solid #0f2041;
        }

        .stat-card h3 {
            margin: 0 0 15px;
            color: #555;
            font-size: 16px;
        }

        .stat-number {

            font-size: 36px;

            font-weight: bold;

            color: #0f2041;
        }


        /* =========================
           ACTIONS
        ========================= */

        .section-title {

            color: #0f2041;

            margin-bottom: 20px;
        }

        .actions {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }

        .action-btn {

            display: block;

            text-decoration: none;

            text-align: center;

            background: #0f2041;

            color: white;

            padding: 18px;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.2s;
        }

        .action-btn:hover {

            background: #1b376d;

            transform: translateY(-2px);
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error {

            display: none;

            background: #ffebee;

            color: #b71c1c;

            padding: 15px;

            border-radius: 6px;

            margin-bottom: 20px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .stats,
            .actions {

                grid-template-columns: 1fr;
            }

            .header {

                padding: 20px;
            }

            .container {

                width: 94%;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div>

        <h1>
            Police Crime Record Management System
        </h1>

        <p>
            Clerk Dashboard
        </p>

    </div>

    <button
        class="logout-btn"
        onclick="logout()">

        Logout

    </button>

</div>



<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- WELCOME -->

    <div class="welcome">

        <h2 id="welcomeText">
            Welcome, Clerk
        </h2>

        <p>
            Manage FIR searches, criminal records
            and reports.
        </p>

    </div>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="error">
    </div>



    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">


        <!-- TOTAL FIR -->

        <div class="stat-card">

            <h3>
                Total FIRs
            </h3>

            <div
                class="stat-number"
                id="totalFIRs">

                0

            </div>

        </div>


        <!-- CRIMINAL RECORDS -->

        <div class="stat-card">

            <h3>
                Criminal Records
            </h3>

            <div
                class="stat-number"
                id="totalCriminals">

                0

            </div>

        </div>


        <!-- REPORTS -->

        <div class="stat-card">

            <h3>
                Reports
            </h3>

            <div
                class="stat-number"
                id="totalReports">

                0

            </div>

        </div>


    </div>



    <!-- =========================
         CLERK ACTIONS
    ========================= -->

    <h2 class="section-title">
        Clerk Actions
    </h2>


    <div class="actions">


        <a
            href="search-fir.html"
            class="action-btn">

            Search FIR

        </a>


        <a
            href="criminal-records.html"
            class="action-btn">

            Criminal Records

        </a>


        <a
            href="reports.html"
            class="action-btn">

            Reports

        </a>


    </div>


</div>



<script>


/* =========================================
   GET LOGGED-IN USER
========================================= */

const user =
    JSON.parse(
        sessionStorage.getItem("pcrmsUser")
    );


/* =========================================
   LOGIN CHECK
========================================= */

if (!user || !user.token) {

    window.location.href =
        "../index.html";

}


/* =========================================
   ROLE CHECK
========================================= */

if (
    user.role &&
    user.role !== "CLERK"
) {

    alert("Access denied.");

    window.location.href =
        "../index.html";

}


/* =========================================
   WELCOME MESSAGE
========================================= */

if (user.fullName) {

    document.getElementById(
        "welcomeText"
    ).textContent =
        "Welcome, " + user.fullName;

}


/* =========================================
   API URL
========================================= */

const API =
    "http://localhost:8080/api";


/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard() {

    console.log(
        "Loading Clerk Dashboard..."
    );

    console.log(
        "User:",
        user
    );


    try {


        /* =================================
           FIR SUMMARY
        ================================= */

        const firResponse =
            await fetch(
                `${API}/reports/fir-summary`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " +
                            user.token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        console.log(
            "FIR HTTP Status:",
            firResponse.status
        );


        if (!firResponse.ok) {

            throw new Error(
                "FIR Summary API returned HTTP " +
                firResponse.status
            );

        }


        const firData =
            await firResponse.json();


        console.log(
            "FIR DATA:",
            firData
        );


        /* =================================
           UPDATE FIR CARD
        ================================= */

        document.getElementById(
            "totalFIRs"
        ).textContent =
            firData.totalFIRs ?? 0;



        /* =================================
           CRIMINAL SUMMARY
        ================================= */

        const criminalResponse =
            await fetch(
                `${API}/reports/criminal-summary`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " +
                            user.token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        console.log(
            "Criminal HTTP Status:",
            criminalResponse.status
        );


        if (!criminalResponse.ok) {

            throw new Error(
                "Criminal Summary API returned HTTP " +
                criminalResponse.status
            );

        }


        const criminalData =
            await criminalResponse.json();


        console.log(
            "CRIMINAL DATA:",
            criminalData
        );


        /* =================================
           UPDATE CRIMINAL CARD
        ================================= */

        document.getElementById(
            "totalCriminals"
        ).textContent =
            criminalData.totalCriminals ?? 0;



        /* =================================
           REPORT COUNT
        ================================= */

        /*
         * Currently PCRMS has two report APIs:
         *
         * 1. FIR Summary
         * 2. Criminal Summary
         *
         * Therefore display 2.
         */

        document.getElementById(
            "totalReports"
        ).textContent = "2";


    }

    catch (error) {


        console.error(
            "Dashboard error:",
            error
        );


        const errorBox =
            document.getElementById(
                "errorMessage"
            );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Unable to load dashboard data: " +
            error.message;

    }

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    sessionStorage.removeItem(
        "pcrmsUser"
    );

    window.location.href =
        "../index.html";

}


/* =========================================
   START
========================================= */

loadDashboard();


</script>


</body>

</html>
